<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

<body class="bg-slate-50 p-10">
    <div class="max-w-2xl mx-auto bg-white rounded-3xl shadow-xl overflow-hidden border border-emerald-100">
        <div class="bg-emerald-600 p-8 text-white flex items-center">
            <i class="fas fa-chalkboard-teacher text-5xl mr-6 opacity-50"></i>
            <div>
                <h1 class="text-2xl font-bold italic">Thầy/Cô: {{ giang_vien.name }}</h1>
                <p class="text-emerald-100">Mã giảng viên: #{{ teacher.id }}</p>
            </div>
        </div>
        <div class="p-8 space-y-4">
            <div class="flex justify-between border-b pb-2">
                <span class="text-gray-500">Khoa:</span>
                <span class="font-bold text-emerald-700">{{ teacher.khoa }}</span>
            </div>
            <div class="flex justify-between border-b pb-2">
                <span class="text-gray-500">Học vị:</span>
                <span class="font-bold italic">{{ teacher.hoc_vi }}</span>
            </div>
            <div class="flex justify-between">
                <span class="text-gray-500">Văn phòng:</span>
                <span class="font-bold uppercase">{{ teacher.phong }}</span>
            </div>
        </div>
    </div>
</body>
