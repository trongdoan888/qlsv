<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Thêm sinh viên mới</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-6">

    <div class="max-w-2xl w-full bg-white rounded-3xl shadow-2xl overflow-hidden border border-gray-100">
        <div class="bg-indigo-600 p-8 text-white text-center">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-white/20 rounded-full mb-4">
                <i class="fas fa-user-plus text-3xl"></i>
            </div>
            <h1 class="text-2xl font-bold uppercase tracking-wide">Thêm Sinh Viên Mới</h1>
            <p class="text-indigo-100 text-sm mt-1">Vui lòng nhập đầy đủ thông tin bên dưới</p>
        </div>

        <form onsubmit="event.preventDefault(); sendData();" class="p-8 grid grid-cols-1 md:grid-cols-2 gap-6">
            {% csrf_token %}

            <div class="md:col-span-1">
                <label for="id" class="block text-sm font-semibold text-gray-700 mb-2">Mã sinh viên (ID)</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
                        <i class="fas fa-id-card"></i>
                    </span>
                    <input type="text" name="id" required
                           class="w-full pl-10 pr-4 py-2.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all"
                           placeholder="Ví dụ: SV001">
                </div>
            </div>

            <div class="md:col-span-1">
                <label for="name" class="block text-sm font-semibold text-gray-700 mb-2">Họ và Tên</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
                        <i class="fas fa-user"></i>
                    </span>
                    <input type="text" name="name" required
                           class="w-full pl-10 pr-4 py-2.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all"
                           placeholder="Nguyễn Văn A">
                </div>
            </div>

            <div class="md:col-span-1">
                <label for="age" class="block text-sm font-semibold text-gray-700 mb-2">Tuổi</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
                        <i class="fas fa-calendar-day"></i>
                    </span>
                    <input type="number" name="age" required min="17" max="50"
                           class="w-full pl-10 pr-4 py-2.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all"
                           placeholder="18">
                </div>
            </div>

            <div class="md:col-span-1">
                <label for="lop" class="block text-sm font-semibold text-gray-700 mb-2">Lớp học</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
                        <i class="fas fa-university"></i>
                    </span>
                    <input type="text" name="lop" required
                           class="w-full pl-10 pr-4 py-2.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all"
                           placeholder="Ví dụ: CNTT K15">
                </div>
            </div>

            <div class="md:col-span-2">
                <label for="email" class="block text-sm font-semibold text-gray-700 mb-2">Địa chỉ Email</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
                        <i class="fas fa-envelope"></i>
                    </span>
                    <input type="email" name="email" required
                           class="w-full pl-10 pr-4 py-2.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all"
                           placeholder="tensinhvien@email.com">
                </div>
            </div>

            <div class="md:col-span-2 flex items-center justify-end space-x-4 mt-4">
                <a href="{% url 'information' %}" class="px-6 py-2.5 rounded-xl text-sm font-semibold text-gray-500 hover:bg-gray-100 transition-all">
                    Hủy bỏ
                </a>
                <button type="submit" 
                        class="bg-indigo-600 hover:bg-indigo-700 text-white px-8 py-2.5 rounded-xl font-bold shadow-lg shadow-indigo-200 transition-all transform active:scale-95">
                    Lưu thông tin
                </button>
            </div>
        </form>
    </div>

    <script>
    function sendData() {

        const data = {
            id : document.querySelector('input[name="id"]').value,
            name : document.querySelector('input[name="name"]').value,
            age : document.querySelector('input[name="age"]').value,
            email : document.querySelector('input[name="email"]').value,
            lop : document.querySelector('input[name="lop"]').value  
        }

        console.log("Data to send:", data);

        fetch('/api/create-student/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': '{{ csrf_token }}'
            },
            body: JSON.stringify(data)
        })
        .then(response => response.json())
        .then(result => {
            if (result.ok) {
                alert(result.message);
                window.location.href = "{% url 'information' %}";
            } else  {
                alert("Thất bại: " + (result.error || "Đã xảy ra lỗi không xác định"));
            }
        })
        .catch(error => {
            console.error('Error:', error);
            alert("Khong thể kết nối đến server. Vui lòng thử lại sau!");
        });
    }
    
    </script>
</body>
</html>
