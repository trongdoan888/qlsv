<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đăng nhập - Hệ thống Quản lý</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 h-screen flex items-center justify-center">

    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl overflow-hidden border border-gray-100">
        <div class="bg-indigo-600 p-8 text-center">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-white/20 rounded-full mb-4">
                <i class="fas fa-user-shield text-3xl text-white"></i>
            </div>
            <h2 class="text-2xl font-bold text-white">Chào mừng trở lại!</h2>
            <p class="text-indigo-100 text-sm mt-2">Vui lòng đăng nhập để quản lý sinh viên</p>
        </div>

        <form onsubmit='event.preventDefault(); checkLogin();' class="p-8 space-y-6">
            
            <div>
            {% csrf_token %}<label class="block text-sm font-semibold text-gray-700 mb-2" for="username">Tên đăng nhập</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
                        <i class="fas fa-user"></i>
                    </span>
                    <input type="text" name="username" required
                        class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all"
                        placeholder="Nhập tài khoản của bạn">
                </div>
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2" for="password">Mật khẩu</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
                        <i class="fas fa-lock"></i>
                    </span>
                    <input type="password" name="password" required
                        class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all"
                        placeholder="••••••••">
                </div>
            </div>

            <div class="flex items-center justify-between">
                <label class="flex items-center">
                    <input type="checkbox" class="h-4 w-4 text-indigo-600 focus:ring-indigo-500 border-gray-300 rounded">
                    <span class="ml-2 text-sm text-gray-600">Ghi nhớ đăng nhập</span>
                </label>
            </div>

            {% if error %}
                <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative" role="alert">
                    <strong class="font-bold">Lỗi! </strong>
                    <span class="block sm:inline">{{ error }}</span>
                </div>
            {% endif %}

            <button type="submit" 
                class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-lg shadow-lg hover:shadow-indigo-200 transition-all transform active:scale-[0.98]">
                ĐĂNG NHẬP
                
            </button>
        </form>
    </div>

    <script>
        function checkLogin() {
            const username = document.querySelector('input[name="username"]').value;
            const password = document.querySelector('input[name="password"]').value;

            if (!username || !password) {
                alert("Vui lòng nhập cả tên đăng nhập và mật khẩu.");
                return false;
            }

            const data = {
                username: username,
                password: password
            };
            
            console.log("Dữ liệu đăng nhập:", data);

            fetch("{% url 'login_api' %}", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "X-CSRFToken": "{{ csrf_token }}"
                },
                body: JSON.stringify(data)
            })

            .then(respone => {
                const isHttpOk = respone.ok;
                return respone.json().then(jsonData => ({ isHttpOk, result: jsonData }));
            })
            .then(({ isHttpOk, result }) => {
                console.log("Kết quả từ API:", result.role);

                if (isHttpOk) {
                    if (result.role === "admin") {
                        localStorage.setItem('username', username); 
                        localStorage.setItem('password', password); 
                        window.location.href = "{% url 'information' %}";
                    } else {
                        alert("Bạn không có quyền truy cập vào trang quản lý.");
                    }
                } else {
                    alert(result.error || "Đăng nhập thất bại. Vui lòng thử lại.");
                }
            })
            .catch(error => {
                console.error("Lỗi khi gọi API:", error);
                alert("Đã xảy ra lỗi khi kết nối đến máy chủ. Vui lòng thử lại sau.");
            });
        }
    </script>

</body>
</html>
