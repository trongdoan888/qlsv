<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Chỉnh sửa thông tin giảng viên</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-6">

    <div class="max-w-2xl w-full bg-white rounded-3xl shadow-2xl overflow-hidden border border-gray-100">
        <div class="bg-amber-500 p-8 text-white text-center">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-white/20 rounded-full mb-4">
                <i class="fas fa-user-edit text-3xl"></i>
            </div>
            <h1 class="text-2xl font-bold uppercase tracking-wide">Chỉnh Sửa Thông Tin Giảng Viên</h1>
            <p class="text-amber-100 text-sm mt-1">Thay đổi thông tin hồ sơ của giảng viên trong hệ thống</p>
        </div>

        <form  onsubmit="event.preventDefault(); updateData('{{ teacher.id }}');" class="p-8 grid grid-cols-1 md:grid-cols-2 gap-6">
            {% csrf_token %}

            <div class="md:col-span-1">
                <label class="block text-sm font-semibold text-gray-500 mb-2">Mã giảng viên (Không thể sửa)</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
                        <i class="fas fa-lock"></i>
                    </span>
                    <input type="text" value="{{ teacher.id }}" disabled
                           class="w-full pl-10 pr-4 py-2.5 bg-gray-100 border border-gray-200 text-gray-500 rounded-xl cursor-not-allowed outline-none font-mono font-bold">
                    <input type="hidden" name="id" value="{{ teacher.id }}">
                </div>
            </div>

            <div class="md:col-span-1">
                <label class="block text-sm font-semibold text-gray-700 mb-2">Khoa công tác</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
                        <i class="fas fa-building-columns"></i>
                    </span>
                    <input type="text" name="khoa" value="{{ teacher.khoa }}" required
                           class="w-full pl-10 pr-4 py-2.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-amber-500 focus:border-amber-500 outline-none transition-all">
                </div>
            </div>

            <div class="md:col-span-2">
                <label class="block text-sm font-semibold text-gray-700 mb-2">Họ và Tên</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
                        <i class="fas fa-user-tie"></i>
                    </span>
                    <input type="text" name="name" value="{{ teacher.name }}" required
                           class="w-full pl-10 pr-4 py-2.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-amber-500 focus:border-amber-500 outline-none transition-all">
                </div>
            </div>

            <div class="md:col-span-2 sm:md:col-span-1">
                <label class="block text-sm font-semibold text-gray-700 mb-2">Tuổi</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
                        <i class="fas fa-user-clock"></i>
                    </span>
                    <input type="number" name="age" value="{{ teacher.age }}" required min="25" max="70"
                           class="w-full pl-10 pr-4 py-2.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-amber-500 focus:border-amber-500 outline-none transition-all">
                </div>
            </div>

            <div class="md:col-span-2">
                <label class="block text-sm font-semibold text-gray-700 mb-2">Email công vụ</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
                        <i class="fas fa-envelope-open-text"></i>
                    </span>
                    <input type="email" name="email" value="{{ teacher.email }}" required
                           class="w-full pl-10 pr-4 py-2.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-amber-500 focus:border-amber-500 outline-none transition-all">
                </div>
            </div>

            <div class="md:col-span-2 flex items-center justify-end space-x-4 mt-4 border-t pt-6">
                <button type="button" onclick="history.back()" 
                        class="px-6 py-2.5 rounded-xl text-sm font-semibold text-gray-500 hover:bg-gray-100 transition-all">
                    Hủy bỏ
                </button>
                <button type="submit" 
                        class="bg-amber-500 hover:bg-amber-600 text-white px-8 py-2.5 rounded-xl font-bold shadow-lg shadow-amber-200 transition-all transform active:scale-95">
                    Lưu thay đổi
                </button>
            </div>
        </form>
    </div>
    <script>
        function updateData(teacherId) {
            const data = {
                id: teacherId,
                name: document.querySelector('input[name="name"]').value,
                age: document.querySelector('input[name="age"]').value,
                khoa: document.querySelector('input[name="khoa"]').value,
                email: document.querySelector('input[name="email"]').value
            };

            fetch(`/api/update_teacher/${teacherId}/`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': '{{ csrf_token }}'
                },
                body: JSON.stringify(data)
            })

            .then(response => {
                if (response.ok) {
                    alert("Thông tin giảng viên đã được cập nhật thành công!");
                    window.location.href = "{% url 'teacher_detail' teacher.id %}";
                } else {
                    alert("Đã xảy ra lỗi khi cập nhật thông tin giảng viên.");
                }
            })
            .catch(error => {
                console.error("Lỗi khi gửi yêu cầu cập nhật:", error);
                alert("Đã xảy ra lỗi khi gửi yêu cầu cập nhật thông tin giảng viên.");
            });
        }
    </script>
</body>
</html>
