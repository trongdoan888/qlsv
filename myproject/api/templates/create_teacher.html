<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Thêm giảng viên mới</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-6">

    <div class="max-w-2xl w-full bg-white rounded-3xl shadow-2xl overflow-hidden border border-gray-100">
        <div class="bg-emerald-600 p-8 text-white text-center">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-white/20 rounded-full mb-4">
                <i class="fas fa-chalkboard-teacher text-3xl"></i>
            </div>
            <h1 class="text-2xl font-bold uppercase tracking-wide">Thêm Giảng Viên Mới</h1>
            <p class="text-emerald-100 text-sm mt-1">Cập nhật hồ sơ nhân sự vào hệ thống</p>
        </div>

        <form onsubmit="event.preventDefault(); send_Data();"  class="p-8 grid grid-cols-1 md:grid-cols-2 gap-6">
            {% csrf_token %}

            <div class="md:col-span-1">
                <label for="id" class="block text-sm font-semibold text-gray-700 mb-2">Mã giảng viên (ID)</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
                        <i class="fas fa-id-badge"></i>
                    </span>
                    <input type="text" name="id" required
                           class="w-full pl-10 pr-4 py-2.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition-all"
                           placeholder="Ví dụ: GV-CNTT-01">
                </div>
            </div>

            <div class="md:col-span-1">
                <label for="name" class="block text-sm font-semibold text-gray-700 mb-2">Họ và Tên</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
                        <i class="fas fa-user-tie"></i>
                    </span>
                    <input type="text" name="name" required
                           class="w-full pl-10 pr-4 py-2.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition-all"
                           placeholder="PGS. TS. Nguyễn Văn B">
                </div>
            </div>

            <div class="md:col-span-1">
                <label for="age" class="block text-sm font-semibold text-gray-700 mb-2">Tuổi</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
                        <i class="fas fa-user-clock"></i>
                    </span>
                    <input type="number" name="age" required min="25" max="70"
                           class="w-full pl-10 pr-4 py-2.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition-all"
                           placeholder="35">
                </div>
            </div>

            <div class="md:col-span-1">
                <label for="khoa" class="block text-sm font-semibold text-gray-700 mb-2">Khoa công tác</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
                        <i class="fas fa-building-columns"></i>
                    </span>
                    <input type="text" name="khoa" required
                           class="w-full pl-10 pr-4 py-2.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition-all"
                           placeholder="Ví dụ: Khoa học máy tính">
                </div>
            </div>

            <div class="md:col-span-2">
                <label for="email" class="block text-sm font-semibold text-gray-700 mb-2">Email công vụ</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
                        <i class="fas fa-envelope-open-text"></i>
                    </span>
                    <input type="email" name="email" required
                           class="w-full pl-10 pr-4 py-2.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition-all"
                           placeholder="giangvien@truonghoc.edu.vn">
                </div>
            </div>

            <div class="md:col-span-2 flex items-center justify-end space-x-4 mt-4 border-t pt-6">
                <button type="button" onclick="history.back()" class="text-sm font-semibold text-gray-400 hover:text-gray-600 px-4 py-2 transition-all">
                    Hủy bỏ
                </button>
                <button type="submit" 
                        class="bg-emerald-600 hover:bg-emerald-700 text-white px-10 py-2.5 rounded-xl font-bold shadow-lg shadow-emerald-200 transition-all transform active:scale-95">
                    Xác nhận thêm
                </button>
            </div>
        </form>
    </div>

    <script>
        function send_Data() {
            const data = {
                id: document.querySelector('input[name="id"]').value,
                name: document.querySelector('input[name="name"]').value,
                age: document.querySelector('input[name="age"]').value,
                khoa: document.querySelector('input[name="khoa"]').value,
                email: document.querySelector('input[name="email"]').value
            }

            console.log("Dữ liệu gửi đi:", data);

            fetch("{% url 'create_teacher_api' %}", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "X-CSRFToken": "{{ csrf_token }}"
                },
                body: JSON.stringify(data)
            })

            fetch('/api/create-teacher/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': '{{ csrf_token }}'
            },
            body: JSON.stringify(data)
            })
            .then(response => {
                const isHttpOk = response.ok;
                return response.json().then(jsonData => ({ isHttpOk, result: jsonData }));
            })
            .then(({ isHttpOk, result }) => {
                if (isHttpOk || result.message) {
                    alert(result.message || "Thêm giảng viên thành công!");
                    // Quay về trang chính và cập nhật lại dữ liệu
                    window.location.href = "{% url 'information' %}";
                } else  {
                    alert("Thất bại: " + (result.error || "Mã giảng viên đã tồn tại hoặc dữ liệu sai"));
                }
            })
            .catch(error => {
                console.error('Lỗi thực thi JavaScript:', error);
                alert("Không thể xử lý dữ liệu hoặc mất kết nối server!");
            });
        }

    </script>

</body>
</html>
