<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tạo tài khoản mới</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-6">

    <div class="max-w-md w-full bg-white rounded-3xl shadow-2xl overflow-hidden border border-gray-100">
        <div class="bg-slate-800 p-8 text-white text-center">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-white/10 rounded-full mb-4">
                <i class="fas fa-user-shield text-3xl text-indigo-400"></i>
            </div>
            <h1 class="text-2xl font-bold uppercase tracking-wide">Tạo Tài Khoản</h1>
            <p class="text-slate-400 text-sm mt-1">Cấp quyền truy cập hệ thống cho thành viên mới</p>
        </div>

        <form onsubmit="event.preventDefault(); createAccount();" class="p-8 space-y-6">
            {% csrf_token %}

            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">Tên đăng nhập</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
                        <i class="fas fa-user"></i>
                    </span>
                    <input type="text" name="username" required
                           class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all"
                           placeholder="Nhập tên tài khoản...">
                </div>
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">Mật khẩu</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
                        <i class="fas fa-key"></i>
                    </span>
                    <input type="password" name="password" required
                           class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all"
                           placeholder="••••••••">
                </div>
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">Mã sinh viên/Giảng viên</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
                        <i class="fas fa-user"></i>
                    </span>
                    <input type="text" name="id" required
                           class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all"
                           placeholder="Nhập mã sinh viên hoặc giảng viên...">
                </div>
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">Vai trò (Role)</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400 pointer-events-none">
                        <i class="fas fa-users-cog"></i>
                    </span>
                    <select name="role" required
                            class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all appearance-none bg-white">
                        <option value="" disabled selected>Chọn vai trò...</option>
                        <option value="student">Sinh viên</option>
                        <option value="teacher">Giảng viên</option>
                        <option value="admin">Quản trị viên</option>
                    </select>
                    <div class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none text-gray-400">
                        <i class="fas fa-chevron-down text-xs"></i>
                    </div>
                </div>
            </div>

            <div class="pt-4">
                <button type="submit" 
                        class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-xl shadow-lg shadow-indigo-200 transition-all transform active:scale-[0.98]">
                    TẠO TÀI KHOẢN
                </button>
            </div>

            <div class="text-center">
                <a href="javascript:history.back()" class="text-sm text-gray-500 hover:text-indigo-600 transition-colors">
                    <i class="fas fa-arrow-left mr-1"></i> Quay lại trang quản lý
                </a>
            </div>
        </form>
    </div>

    <script>    
        function createAccount() {

            const username = document.querySelector('input[name="username"]').value;
            const password = document.querySelector('input[name="password"]').value;
            const role = document.querySelector('select[name="role"]').value;
            const id = document.querySelector('input[name="id"]').value;

            if (!username || !password || !role || !id) {
                alert("Vui lòng điền đầy đủ thông tin.");
                return;
            }

            if (role !== "student" && role !== "teacher") {
                alert("Vai trò không hợp lệ. Vui lòng chọn 'student', 'teacher' .");
                return;
            } else if ( role === "admin") {
                alert("Không thể tạo tài khoản với vai trò admin. Vui lòng chọn 'student' hoặc 'teacher'.");
                return;
            }

            const data = {
                username, 
                password,
                role,
                id
            }
            console.log(data);

            fetch("/api/create-account/", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "X-CSRFToken": "{{ csrf_token }}"
                },
                body: JSON.stringify(data)
            })

            .then(respone => {
                const isHttpOk = respone.ok;
                return respone.json().then(jsonData => ({ isHttpOk, result: jsonData }));
            })
            .then(({ isHttpOk, result }) => {
                console.log("Kết quả từ API:", result.id_check);

                if (isHttpOk) {
                    if (result.id_check === id) {
                        alert("Tài khoản đã tồn tại. Vui lòng chọn mã sinh viên/giảng viên khác.");
                    } else {
                        alert("Tạo tài khoản thành công!");
                        window.location.href = "{% url 'information' %}";
                    }
                } else {
                    alert(result.error || "Tạo tài khoản thất bại. Vui lòng thử lại.");
                }
            })
            .catch(error => {
                console.error("Lỗi khi gọi API:", error);
                alert("Đã xảy ra lỗi khi kết nối đến máy chủ. Vui lòng thử lại sau.");
            });
        }

    </script>
</body>
</html>
