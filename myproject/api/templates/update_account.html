<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cập nhật tài khoản</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-6">

    <div class="max-w-md w-full bg-white rounded-3xl shadow-2xl overflow-hidden border border-gray-100">
        <div class="bg-amber-500 p-8 text-white text-center">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-white/20 rounded-full mb-4">
                <i class="fas fa-user-cog text-3xl"></i>
            </div>
            <h1 class="text-2xl font-bold uppercase tracking-wide">Cập Nhật Tài Khoản</h1>
            <p class="text-amber-100 text-sm mt-1">Chỉnh sửa thông tin tài khoản hệ thống</p>
        </div>

        <form onsubmit="event.preventDefault(); updateAccount('{{ account.id }}')" class="p-8 space-y-5">
            {% csrf_token %}

            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">ID Liên kết (Sinh viên / Giảng viên)</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
                        <i class="fas fa-fingerprint"></i>
                    </span>
                    <input type="text" value="{{ account.id }}" disabled
                           class="w-full pl-10 pr-4 py-2.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-amber-500 focus:border-amber-500 outline-none transition-all font-mono font-bold">
                </div>
                {% if error_id %}
                    <p class="text-red-500 text-xs mt-1.5 font-medium"><i class="fas fa-exclamation-circle mr-1"></i> {{ error_id }}</p>
                {% endif %}
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">Tên đăng nhập (User)</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
                        <i class="fas fa-user"></i>
                    </span>
                    <input type="text" name="username" value="{{ account.username }}" required
                           class="w-full pl-10 pr-4 py-2.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-amber-500 focus:border-amber-500 outline-none transition-all">
                </div>
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">Mật khẩu (Pass)</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
                        <i class="fas fa-key"></i>
                    </span>
                    <input type="password" name="password" value="{{ account.password }}" required
                           class="w-full pl-10 pr-4 py-2.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-amber-500 focus:border-amber-500 outline-none transition-all">
                </div>
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">Vai trò (Role)</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400 pointer-events-none">
                        <i class="fas fa-users-cog"></i>
                    </span>
                    <select name="role" id="field_role" required
                            class="w-full pl-10 pr-4 py-2.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-amber-500 focus:border-amber-500 outline-none transition-all appearance-none bg-white">
                        <option value="student" {% if account.role == 'student' %}selected{% endif %}>Sinh viên</option>
                        <option value="teacher" {% if account.role == 'teacher' %}selected{% endif %}>Giảng viên</option>
                    </select>
                    <div class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none text-gray-400">
                        <i class="fas fa-chevron-down text-xs"></i>
                    </div>
                </div>
            </div>

            <div class="flex items-center justify-end space-x-3 pt-4 border-t">
                <button type="button" onclick="exitDirectly()" class="px-5 py-2.5 rounded-xl text-sm font-semibold text-gray-500 hover:bg-gray-100 transition-all">
                    Hủy
                </button>
                <button type="button" onclick="updateAccount({{ account.id }})"
                        class="bg-amber-500 hover:bg-amber-600 text-white px-6 py-2.5 rounded-xl font-bold shadow-lg shadow-amber-150 transition-all transform active:scale-95">
                    Xác nhận
                </button>
            </div>
        </form>
    </div>

    <script>
        function updateAccount(accountId) {
            const data = {
                username: document.querySelector('input[name="username"]').value,
                password: document.querySelector('input[name="password"]').value,
                role: document.querySelector('select[name="role"]').value
            };

            console.log("Dữ liệu gửi đi:", data); // Debug: Kiểm tra dữ liệu trước khi gửi

            fetch(`/api/update-account/${accountId}/`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': '{{ csrf_token }}'
                },
                body: JSON.stringify(data)
            })
            .then(response => {
            const isHttpOk = response.ok;
            return response.json().then(jsonData => ({ isHttpOk, result: jsonData }));
            })
            
            .then(({ isHttpOk, result }) => {
                if (isHttpOk || result.message) {

                    alert( result.message || "Cập nhật tài khoản thành công!");

                    if (document.referrer) {
                        
                        const prevUrl = new URL(document.referrer);

                        prevUrl.searchParams.set('updated_account_id', Date.now()); // Thêm tham số để buộc reload
                        
                        window.location.href = prevUrl.toString();
                    } else {

                        window.location.href = "{% url 'information' %}"; // Quay về trang quản lý tài khoản

                    }
                } else {
                    console.error("Lỗi từ backend:", result.error);
                    alert("Có lỗi xảy ra: " + result.error);
                }
            })
            .catch(error => {
                console.error("Lỗi khi gửi yêu cầu:", error);
                alert("Có lỗi xảy ra khi gửi yêu cầu.");
            });
        }
    </script>
</body>
</html>
